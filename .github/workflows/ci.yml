name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://growth:growth@localhost:5433/growth?schema=public
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-32chars
  # No frontend/proxy runs in CI, so the backend's own port is the right value here.
  # In dev this must match the Vite origin (see backend/.env.example) because a real browser is involved.
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: cd backend && bun run prisma:generate
      - run: bun run build

  test:
    name: Test
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_USER: growth
          POSTGRES_PASSWORD: growth
          POSTGRES_DB: growth
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U growth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: cd backend && bun run prisma:generate
      - run: cd backend && bun run prisma:deploy
      - run: cd frontend && bunx playwright install --with-deps chromium
      - run: bun run test
