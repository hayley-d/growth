name: Release source

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  source:
    name: Source is staging
    runs-on: ubuntu-latest
    steps:
      - if: github.base_ref == 'master' && (github.head_ref != 'staging' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "Only staging can go into master."
          exit 1
