<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 756" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Stick first, steps 1 to 3. Three frames. Frame 1 shows the stick 1-2-3-4 and the O(n) search. Frame 2 shows a bushy AVL tree with 40 at the root. Frame 3 works heights on 20, 10, 30 and 5.</title>
  <style>@import url("https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap");</style>
  <rect width="1060" height="756" fill="#eceff4"/>
  <g>
    <rect x="18" y="18" width="328" height="720" rx="22" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="34" y="40" font-size="11" fill="#5b6477" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">AVL trees · Lesson 7</text><text x="34" y="58" font-size="14" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Height and balance factor</text><rect x="34" y="70" width="296" height="8" rx="4" fill="#e2e6ee"/><rect x="34" y="70" width="49.33333333333333" height="8" rx="4" fill="#1b2130"/><text x="34" y="92" font-size="11" fill="#5b6477" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Step 1 of 6</text><line x1="18" y1="102" x2="346" y2="102" stroke="#bfc6d2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="34" y="130" font-size="18" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700">Why balance matters</text><text x="34" y="161" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">A plain binary search tree puts</text>
<text x="34" y="179" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">smaller keys on the left and</text>
<text x="34" y="197" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">bigger keys on the right. That is</text>
<text x="34" y="215" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">fine when branches stay similar lengths.</text>
<text x="34" y="233" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif"></text>
<text x="34" y="251" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Insert 1, 2, 3, 4 with no</text>
<text x="34" y="269" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">rebalancing and each new key hangs</text>
<text x="34" y="287" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">under the last one. The tree</text>
<text x="34" y="305" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">becomes a stick.</text>
<text x="34" y="323" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif"></text><g>
    <rect x="34" y="345" width="296" height="210" rx="12" fill="#ffffff" stroke="#bfc6d2" stroke-width="1.5"/>
    <text x="50" y="367" font-size="11" fill="#5b6477" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">PLAIN BST · NO REBALANCING</text>
           <g>
    <line x1="94" y1="397" x2="94" y2="443" stroke="#5b6477" stroke-width="2"/><line x1="94" y1="443" x2="94" y2="489" stroke="#5b6477" stroke-width="2"/><line x1="94" y1="489" x2="94" y2="535" stroke="#5b6477" stroke-width="2"/>
    <g>
    <circle cx="94" cy="397" r="16" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="94" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">1</text>
    
  </g>
    <g>
    <circle cx="94" cy="443" r="16" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="94" y="448" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">2</text>
    
  </g>
    <g>
    <circle cx="94" cy="489" r="16" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="94" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">3</text>
    
  </g>
    <g>
    <circle cx="94" cy="535" r="16" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="94" y="540" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">4</text>
    
  </g>
  </g>
           <text x="144" y="415" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Search for 4 walks</text>
           <text x="144" y="435" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">1 → 2 → 3 → 4.</text>
           <text x="144" y="463" font-size="13" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">That is O(n), not O(log n).</text>
  </g><line x1="18" y1="672" x2="346" y2="672" stroke="#bfc6d2" stroke-width="1.5" stroke-dasharray="5 4"/><g>
    <rect x="34" y="682" width="88" height="36" rx="10" fill="#ffffff" stroke="#1b2130" stroke-width="1.5"/>
    <text x="78" y="705" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Back</text>
  </g><g>
    <rect x="222" y="682" width="108" height="36" rx="10" fill="#1b2130" stroke="#1b2130" stroke-width="1.5"/>
    <text x="276" y="705" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Next</text>
  </g>
  </g>
<g>
    <rect x="366" y="18" width="328" height="720" rx="22" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="382" y="40" font-size="11" fill="#5b6477" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">AVL trees · Lesson 7</text><text x="382" y="58" font-size="14" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Height and balance factor</text><rect x="382" y="70" width="296" height="8" rx="4" fill="#e2e6ee"/><rect x="382" y="70" width="98.66666666666666" height="8" rx="4" fill="#1b2130"/><text x="382" y="92" font-size="11" fill="#5b6477" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Step 2 of 6</text><line x1="366" y1="102" x2="694" y2="102" stroke="#bfc6d2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="382" y="130" font-size="18" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700">AVL keeps the tree</text>
<text x="382" y="153" font-size="18" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700">bushy</text><text x="382" y="184" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">AVL trees fix this. After each</text>
<text x="382" y="202" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">insert they rebalance, so the tree</text>
<text x="382" y="220" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">stays bushy and search stays fast.</text>
<text x="382" y="238" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif"></text><g>
    <rect x="382" y="260" width="296" height="200" rx="12" fill="#ffffff" stroke="#bfc6d2" stroke-width="1.5"/>
    <text x="398" y="280" font-size="11" fill="#5b6477" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">AVL · SAME IDEA, SHORT PATHS</text>
           <g>
    <line x1="520" y1="310" x2="460" y2="364" stroke="#5b6477" stroke-width="2"/><line x1="520" y1="310" x2="580" y2="364" stroke="#5b6477" stroke-width="2"/>
    <line x1="460" y1="364" x2="428" y2="418" stroke="#5b6477" stroke-width="2"/><line x1="460" y1="364" x2="492" y2="418" stroke="#5b6477" stroke-width="2"/>
    <line x1="580" y1="364" x2="548" y2="418" stroke="#5b6477" stroke-width="2"/><line x1="580" y1="364" x2="612" y2="418" stroke="#5b6477" stroke-width="2"/>
    <g>
    <circle cx="520" cy="310" r="16" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="520" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">40</text>
    
  </g>
    <g>
    <circle cx="460" cy="364" r="16" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="460" y="369" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">20</text>
    
  </g>
    <g>
    <circle cx="580" cy="364" r="16" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="580" y="369" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">60</text>
    
  </g>
    <g>
    <circle cx="428" cy="418" r="16" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="428" y="423" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">10</text>
    
  </g>
    <g>
    <circle cx="492" cy="418" r="16" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="492" y="423" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">30</text>
    
  </g>
    <g>
    <circle cx="548" cy="418" r="16" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="548" y="423" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">50</text>
    
  </g>
    <g>
    <circle cx="612" cy="418" r="16" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="612" y="423" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">70</text>
    
  </g>
  </g>
           <text x="398" y="448" font-size="12" fill="#5b6477" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Search never walks more than a few nodes.</text>
  </g><line x1="366" y1="672" x2="694" y2="672" stroke="#bfc6d2" stroke-width="1.5" stroke-dasharray="5 4"/><g>
    <rect x="382" y="682" width="88" height="36" rx="10" fill="#ffffff" stroke="#1b2130" stroke-width="1.5"/>
    <text x="426" y="705" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Back</text>
  </g><g>
    <rect x="570" y="682" width="108" height="36" rx="10" fill="#1b2130" stroke="#1b2130" stroke-width="1.5"/>
    <text x="624" y="705" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Next</text>
  </g>
  </g>
<g>
    <rect x="714" y="18" width="328" height="720" rx="22" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="730" y="40" font-size="11" fill="#5b6477" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">AVL trees · Lesson 7</text><text x="730" y="58" font-size="14" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Height and balance factor</text><rect x="730" y="70" width="296" height="8" rx="4" fill="#e2e6ee"/><rect x="730" y="70" width="148" height="8" rx="4" fill="#1b2130"/><text x="730" y="92" font-size="11" fill="#5b6477" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Step 3 of 6</text><line x1="714" y1="102" x2="1042" y2="102" stroke="#bfc6d2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="730" y="130" font-size="18" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700">Height</text><text x="730" y="161" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">A leaf has height 1. An empty tree</text>
<text x="730" y="179" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">has height 0.</text>
<text x="730" y="197" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif"></text>
<text x="730" y="215" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">The height of a node is 1 plus the</text>
<text x="730" y="233" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">larger height of its two subtrees.</text>
<text x="730" y="251" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif"></text><g>
    <rect x="730" y="273" width="296" height="220" rx="12" fill="#ffffff" stroke="#bfc6d2" stroke-width="1.5"/>
    <g>
    <line x1="836" y1="311" x2="786" y2="367" stroke="#5b6477" stroke-width="2"/><line x1="836" y1="311" x2="886" y2="367" stroke="#5b6477" stroke-width="2"/><line x1="786" y1="367" x2="760" y2="423" stroke="#5b6477" stroke-width="2"/>
    <g>
    <circle cx="836" cy="311" r="16" fill="#ffd23f" stroke="#1b2130" stroke-width="3.5"/>
    <text x="836" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">20</text>
    
  </g>
    <g>
    <circle cx="786" cy="367" r="16" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="786" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">10</text>
    
  </g>
    <g>
    <circle cx="886" cy="367" r="16" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="886" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">30</text>
    
  </g>
    <g>
    <circle cx="760" cy="423" r="16" fill="#ffffff" stroke="#1b2130" stroke-width="2"/>
    <text x="760" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">5</text>
    
  </g>
  </g>
           <text x="746" y="451" font-size="12" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">5 → 1, 30 → 1, 10 → 2, 20 → 3.</text>
           <text x="746" y="471" font-size="12" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">The tree's height is 3.</text>
  </g><line x1="714" y1="672" x2="1042" y2="672" stroke="#bfc6d2" stroke-width="1.5" stroke-dasharray="5 4"/><g>
    <rect x="730" y="682" width="88" height="36" rx="10" fill="#ffffff" stroke="#1b2130" stroke-width="1.5"/>
