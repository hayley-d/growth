    <text x="382" y="40" font-size="11" fill="#5b6477" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">AVL trees · Lesson 7</text><text x="382" y="58" font-size="14" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Height and balance factor</text><rect x="382" y="70" width="296" height="8" rx="4" fill="#e2e6ee"/><rect x="382" y="70" width="246.66666666666669" height="8" rx="4" fill="#1b2130"/><text x="382" y="92" font-size="11" fill="#5b6477" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Step 5 of 6</text><line x1="366" y1="102" x2="694" y2="102" stroke="#bfc6d2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="382" y="130" font-size="18" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700">The AVL rule</text><text x="382" y="161" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">An AVL tree is a binary search</text>
<text x="382" y="179" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">tree where every node's balance</text>
<text x="382" y="197" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">factor is -1, 0 or 1.</text>
<text x="382" y="215" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif"></text>
<text x="382" y="233" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">On the bushy tree, every BF is 0.</text>
<text x="382" y="251" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">On the stick, 1 and 2 sit outside</text>
<text x="382" y="269" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">-1 to 1.</text>
<text x="382" y="287" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif"></text><g>
