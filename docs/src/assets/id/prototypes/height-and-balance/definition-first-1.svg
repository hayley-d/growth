    <text x="34" y="40" font-size="11" fill="#5b6477" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">AVL trees · Lesson 7</text><text x="34" y="58" font-size="14" font-weight="700" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Height and balance factor</text><rect x="34" y="70" width="296" height="8" rx="4" fill="#e2e6ee"/><rect x="34" y="70" width="49.33333333333333" height="8" rx="4" fill="#1b2130"/><text x="34" y="92" font-size="11" fill="#5b6477" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">Step 1 of 6</text><line x1="18" y1="102" x2="346" y2="102" stroke="#bfc6d2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="34" y="130" font-size="18" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700">Height</text><text x="34" y="161" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">A leaf has height 1. An empty tree</text>
<text x="34" y="179" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">has height 0.</text>
<text x="34" y="197" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif"></text>
<text x="34" y="215" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">The height of a node is 1 plus the</text>
<text x="34" y="233" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">larger height of its two subtrees.</text>
<text x="34" y="251" font-size="13" fill="#1b2130" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif"></text><g>
